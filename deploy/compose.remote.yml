# Flimmer mit Docker Compose direkt von GitHub (ohne Klonen), mit dem fertigen Image:
#   curl -fsSL https://raw.githubusercontent.com/Bavarianator/flimmer/main/deploy/compose.remote.yml \
#     | MEDIA_DIR=/pfad/zu/filmen docker compose -f - up -d --pull always
services:
  flimmer:
    image: ghcr.io/bavarianator/flimmer:edge
    container_name: flimmer
    restart: unless-stopped
    ports:
      - "${FLIMMER_PORT:-8096}:8096"
    # Statt ports: network_mode host, damit Apps den Server per SSDP im Heimnetz finden.
    # network_mode: host
    volumes:
      - flimmer-data:/data                     # Einstellungen, Cache, Poster
      - ${MEDIA_DIR:-./medien}:/media:ro       # Medienordner, per MEDIA_DIR oder .env setzen
    # Hardware-Transcoding (Intel/AMD, VAAPI/QSV): einkommentieren, wenn /dev/dri existiert.
    # devices:
    #   - /dev/dri:/dev/dri
    environment:
      TZ: ${TZ:-Europe/Berlin}
      # FLIMMER_TMDB_KEY: ""                   # optional eigener TMDB-Key
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8096'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  flimmer-data:
