<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Flimmer · Profil-PIN · handy</title>
<link rel="stylesheet" href="flimmer.css"><style>

<body><div class="screen fl fl-hd" style="width:390px;height:844px">
<div class="abs" style="left:0;right:0;top:80px;text-align:center"><div class="fl-avatar" style="width:96px" role="button" aria-label="Chris, mit PIN"><div class="kachel" style="background:var(--avatar-3)">C<span class="zusatz"><svg class="fl-icon " viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></span></div><span class="name">Chris</span></div>
