name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ffmpeg für Probe-/Transcode-Tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # web/dist wird eingebettet (go:embed); ohne gebaute UI reicht ein Platzhalter.
      - name: Platzhalter für web/dist
        run: test -f web/dist/index.html || { mkdir -p web/dist && echo '<!doctype html><title>Flimmer</title>' > web/dist/index.html; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: E2E-Smoke-Test (Testmedien → Server → Direct Play/HLS/Untertitel)
        run: scripts/smoke.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: [go, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }} # Projekt-Key, damit Metadaten ohne eigenen Key funktionieren
        run: go build -trimpath -ldflags "-s -w -X github.com/flimmer-media/flimmer/internal/meta.DefaultTMDBKey=$TMDB_KEY" -o dist/flimmer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}${{ matrix.ext }} ./cmd/server
      - uses: actions/upload-artifact@v4
        with:
          name: flimmer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/

  docker:
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PRs bauen nur zur Kontrolle, Pushes auf main veröffentlichen :latest.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest
          build-args: TMDB_KEY=${{ secrets.TMDB_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
