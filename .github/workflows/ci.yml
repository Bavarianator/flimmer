name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"] # Tag v1.2.3 → GitHub Release mit Binaries + Docker :v1.2.3/:latest
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: ffmpeg für Probe-/Transcode-Tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # web/dist wird eingebettet (go:embed); ohne gebaute UI reicht ein Platzhalter.
      - name: Platzhalter für web/dist
        run: test -f web/dist/index.html || { mkdir -p web/dist && echo '<!doctype html><title>Flimmer</title>' > web/dist/index.html; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: E2E-Smoke-Test (Testmedien → Server → Direct Play/HLS/Untertitel)
        run: scripts/smoke.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  build:
    needs: [go, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: windows, goarch: amd64, ext: .exe }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Bauen und packen
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }} # Projekt-Key, damit Metadaten ohne eigenen Key funktionieren
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          name=flimmer-$VERSION-$GOOS-$GOARCH${GOARM:+v$GOARM}
          mkdir -p pkg/$name dist
          go build -trimpath -o pkg/$name/flimmer${{ matrix.ext }} -ldflags "-s -w \
            -X github.com/flimmer-media/flimmer/internal/meta.DefaultTMDBKey=$TMDB_KEY \
            -X github.com/flimmer-media/flimmer/internal/update.Version=$VERSION" ./cmd/server
          cp LICENSE pkg/$name/
          # Rendezvous-Dienst nur für Linux-Server als eigenes Asset
          if [ "$GOOS" = linux ]; then
            relay=flimmer-relay-$VERSION-$GOOS-$GOARCH${GOARM:+v$GOARM}
            go build -trimpath -o "$relay/flimmer-relay" -ldflags "-s -w" ./cmd/relay
            cp LICENSE deploy/relay.service "$relay/"
            tar czf dist/$relay.tar.gz $relay
          fi
          if [ "$GOOS" = windows ]; then
            cp deploy/LIESMICH.txt pkg/$name/
            (cd pkg && zip -qr ../dist/$name.zip $name)
          else
            (cd pkg && tar czf ../dist/$name.tar.gz $name)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: flimmer-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/

  docker:
    needs: [go, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # PRs bauen nur zur Kontrolle, main → :edge, Tag v1.2.3 → :v1.2.3 und :latest (Vorabversionen ohne :latest).
      - id: tags
        run: |
          img=ghcr.io/${GITHUB_REPOSITORY,,}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags=$img:$GITHUB_REF_NAME
            [[ $GITHUB_REF_NAME == *-* ]] || tags=$tags,$img:latest
          else
            tags=$img:edge
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TMDB_KEY=${{ secrets.TMDB_KEY }}
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: github.ref_type == 'tag'
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flimmer-*
          merge-multiple: true
          path: dist
      - run: cd dist && sha256sum * > SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pre=; [[ $GITHUB_REF_NAME == *-* ]] && pre=--prerelease
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Flimmer $GITHUB_REF_NAME" --generate-notes $pre
